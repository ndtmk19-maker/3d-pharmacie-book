<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lesson</title>
<meta name="description" content="An interactive 3D lesson: the drawing lifts off the page and the quantities flow as glowing colour." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&display=block" />
<style>
  /* critical CSS: the loader must be styled before any script arrives */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9b0a2; overscroll-behavior: none; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; padding: 24px; text-align: center;
    background: radial-gradient(ellipse at 50% 44%, #fbf6ea 0%, #efe6d3 58%, #ddd1b9 100%); transition: opacity .7s;
    font-family: "Source Serif 4", Georgia, serif; color: #1c2433; }
  #loader .kicker { font: 600 11px/1 "Source Serif 4", Georgia, serif; letter-spacing: .32em; text-transform: uppercase; color: #9a3b2a; }
  #loader .title { margin-top: 10px; font: italic 560 clamp(40px, 8vw, 84px)/1.05 "Source Serif 4", Georgia, serif;
    clip-path: inset(-20% 100% -20% 0); animation: write 1.1s .2s cubic-bezier(.4,0,.2,1) forwards; }
  #loader .dot { width: 14px; height: 14px; border-radius: 50%; margin: 18px auto 0; background: currentColor; color: #2f7bff;
    box-shadow: 0 0 6px currentColor, 0 0 18px currentColor; animation: stores 3.2s linear infinite; }
  @keyframes write { to { clip-path: inset(-20% 0 -20% 0); } }
  @keyframes stores { 0%,100% { color: #2f7bff } 12.5% { color: #8a4dff } 25% { color: #ff3fb4 } 37.5% { color: #ff7a1c }
    50% { color: #26c75a } 62.5% { color: #e8233a } 75% { color: #18c4dc } 87.5% { color: #ffcf1a } }
  @media (prefers-reduced-motion: reduce) { #loader .title { animation: none; clip-path: none; } #loader .dot { animation: none; } }
  body.ready #loader { opacity: 0; pointer-events: none; }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; background: #e9e3d6; z-index: 6; padding: 24px; text-align: center; font: 16px/1.5 Georgia, serif; }
  body.nogl #nogl { display: grid; }
</style>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="An open book with a 3D drawing. A text version follows."></canvas>
<div id="ui"></div>
<main id="a11y" class="sr" aria-label="Text version of the lesson"></main>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="loader" role="status" aria-live="polite">
  <div><div class="kicker" id="loaderKicker">Lesson</div><div class="title" id="loaderTitle">Loading</div><div class="dot"></div></div>
</div>
<div id="nogl" role="alert"><div><h1 style="font:600 24px Georgia,serif;margin:0 0 10px">This lesson needs WebGL</h1>
<p style="max-width:460px;margin:0 auto">Your browser could not start 3D graphics. Try a recent Chrome, Edge, Firefox or Safari, or turn on hardware acceleration.</p></div></div>
<noscript><p style="position:fixed;inset:auto 0 0 0;padding:12px;background:#fff;text-align:center">This lesson needs JavaScript.</p></noscript>
</body>
</html>
